openapi: 3.0.0
info:
  title: CS2 Results Social OAuth
  version: 1.0.0

x-yc-apigateway:
  service_account_id: ajem0b1cksn4c9ggmjfh
  ignoreTrailingSlashes: true

paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: OAuth service health
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e6hiphvatsctisunm9
        tag: production
        service_account_id: ajem0b1cksn4c9ggmjfh
        payload_format_version: "1.0"

  /oauth/meta/instagram/start:
    get:
      operationId: instagramStart
      responses:
        "302":
          description: Start Instagram OAuth
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e6hiphvatsctisunm9
        tag: production
        service_account_id: ajem0b1cksn4c9ggmjfh
        payload_format_version: "1.0"

  /oauth/meta/instagram/callback:
