name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Compile package
        run: python -m compileall cs2bot

      - name: Run tests
        run: python -m pytest -q

      - name: Build platform-independent function archive
        run: scripts/build_function_zip.sh
      - name: Build isolated monthly VRS publisher archive
        run: python scripts/build_monthly_vrs_function.py

  vrs_reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - name: Install isolated VRS dependencies
        working-directory: video/vrs-major-race/cloud
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test source boundaries, animation and private artifact delivery
        working-directory: video/vrs-major-race/cloud
        run: node --test ../timeline.test.mjs ../data.test.mjs ../monthly.test.mjs handler.test.mjs
      - name: Build isolated Linux function
        run: python3 scripts/build_vrs_major_function.py
      - name: Render and decode full Americas probe in the packaged Linux runtime
        run: node video/vrs-major-race/cloud/probe.mjs
      - name: Render and decode the monthly world edition in the packaged Linux runtime
        run: node video/vrs-major-race/cloud/probe.mjs build/vrs-major-function/handler.mjs monthly
